{% extends "matches/base.html" %}
{% block title %}Sign Up QR Code{% endblock %}
{% block content %}
<div class="card qr-wrapper">
  <h2>Scan to Sign Up</h2>
  <p style="margin-bottom:1rem;color:#64748b;">Show this QR code to new players so they can sign up.</p>
  <img src="data:image/png;base64,{{ qr_b64 }}" alt="Sign Up QR Code">
  <p style="margin-top:1rem;font-size:0.85rem;color:#94a3b8;">{{ signup_url }}</p>
</div>
{% endblock %}
