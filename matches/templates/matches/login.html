{% extends "matches/base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card">
  <h2>Login</h2>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="form-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
      </div>
    {% endfor %}
    <button type="submit" class="btn">Login</button>
  </form>
  <p style="margin-top:1rem;font-size:0.9rem;">No account yet? <a href="{% url 'signup' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">Sign up</a></p>
</div>
{% endblock %}
